name: CI

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, 'format:check']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.check }}

  tests:
    name: Unit tests (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:ci

  package:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:package

  backend:
    name: Backend integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: nebula-sdk-ts
          persist-credentials: false
      - name: Check out backend contract baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Annany2002/nebula-backend
          # Update deliberately when aligning the SDK with a new backend contract.
          ref: 5d35bac8430aadd01546b1a84c436f5d6575fb8c
          path: nebula-backend
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: nebula-sdk-ts/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: nebula-backend/go.mod
          cache-dependency-path: nebula-backend/go.sum
      - run: npm ci
        working-directory: nebula-sdk-ts
      - run: npm run test:backend
        working-directory: nebula-sdk-ts
        env:
          CGO_ENABLED: '1'

  required:
    name: PR checks
    if: ${{ always() }}
    needs: [quality, tests, package, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all check groups to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.tests.result }}
          PACKAGE: ${{ needs.package.result }}
          BACKEND: ${{ needs.backend.result }}
        run: |
          test "$QUALITY" = success
          test "$TESTS" = success
          test "$PACKAGE" = success
          test "$BACKEND" = success
